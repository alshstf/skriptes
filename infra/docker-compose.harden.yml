# Overlay безопасного хардненинга для ПУБЛИЧНОГО (DMZ) деплоя.
#
# Накладывается ПОВЕРХ release-compose:
#   docker compose -f docker-compose.release.yml -f docker-compose.harden.yml \
#                  --env-file .env up -d
#
# Вход — прямо из интернета: на роутере проброшены 443 и 80 на этот хост, TLS
# (Let's Encrypt) делает Caddy сам по infra/Caddyfile.public (его этот overlay и
# монтирует). Хост — изолированный (отдельная VM/VLAN без доступа в LAN).
#
# Принципы: non-root + cap_drop ALL + read-only FS + no-new-privileges + лимиты,
# НИГДЕ нет docker.sock. Внутренние стораджи (postgres/meilisearch) — без read-only
# (пишут в свои volume'ы) и без агрессивного cap_drop (нужны капы для user-drop),
# но с no-new-privileges + лимитами. Интернет-фейсинг (backend/frontend/caddy) —
# полный хардненинг. Книги — локальный путь на хосте (BOOKS_HOST_PATH), не
# сетевой mount из LAN.
#
# Память postgres/meilisearch (#378). Почти всё, что они «едят», — кэш файлов (индекс
# Meili через mmap, страницы таблиц PG); он заполняет любой лимит и вытесняется
# ядром, поэтому «потребление у лимита» — нормальное состояние, а не нехватка.
# Распределяет память ядро:
#   - limits (PG_MEM_LIMIT / MEILI_MEM_LIMIT, дефолт 2g) — потолок на случай утечки;
#   - reservations (PG_MEM_RESERVATION / MEILI_MEM_RESERVATION) — cgroup memory.low,
#     защищённый минимум под горячие данные: при нехватке памяти на хосте ядро
#     сначала отбирает кэш у тех, кто вышел за свой минимум.
# Реальную нехватку видно по PSI (время ожидания памяти) — метрики cAdvisor
# container_pressure_memory_* и node_pressure_memory_*, по ним — алерты.
# Параметры Postgres считаются при старте из его лимита (#304): shared_buffers ¼,
# effective_cache_size ¾, work_mem 1/128 (4–64 МБ), maintenance_work_mem 1/16
# (64 МБ–1 ГБ), JIT выкл.; random_page_cost 1.1 — для SSD, на HDD задайте
# PG_RANDOM_PAGE_COST=4. Любой параметр можно задать явно в env.
services:
  postgres:
    security_opt:
      - no-new-privileges:true
    environment:
      PG_SHARED_BUFFERS: ${PG_SHARED_BUFFERS:-}
      PG_EFFECTIVE_CACHE_SIZE: ${PG_EFFECTIVE_CACHE_SIZE:-}
      PG_WORK_MEM: ${PG_WORK_MEM:-}
      PG_MAINTENANCE_WORK_MEM: ${PG_MAINTENANCE_WORK_MEM:-}
      PG_RANDOM_PAGE_COST: ${PG_RANDOM_PAGE_COST:-}
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Параметры памяти — от лимита контейнера (memory.max), пересчёт на каждом
        # старте; явное значение в env побеждает.
        host_mb=$$(( $$(awk '/^MemTotal:/ {print $$2}' /proc/meminfo) / 1024 ))
        lim=$$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max)
        if [ -z "$$lim" ] || [ "$$lim" = max ]; then mb=$$host_mb; else mb=$$(( lim / 1048576 )); fi
        if [ "$$mb" -gt "$$host_mb" ]; then mb=$$host_mb; fi
        clamp() { v=$$1; if [ "$$v" -lt "$$2" ]; then v=$$2; fi; if [ "$$v" -gt "$$3" ]; then v=$$3; fi; echo "$$v"; }
        sb=$${PG_SHARED_BUFFERS:-$$(( mb / 4 ))MB}
        ecs=$${PG_EFFECTIVE_CACHE_SIZE:-$$(( mb * 3 / 4 ))MB}
        wm=$${PG_WORK_MEM:-$$(clamp $$(( mb / 128 )) 4 64)MB}
        mwm=$${PG_MAINTENANCE_WORK_MEM:-$$(clamp $$(( mb / 16 )) 64 1024)MB}
        rpc=$${PG_RANDOM_PAGE_COST:-1.1}
        echo "pg-autotune: limit $${mb}MB: shared_buffers=$$sb effective_cache_size=$$ecs work_mem=$$wm maintenance_work_mem=$$mwm random_page_cost=$$rpc jit=off" >&2
        exec docker-entrypoint.sh "$$@" -c shared_buffers="$$sb" -c effective_cache_size="$$ecs" -c work_mem="$$wm" -c maintenance_work_mem="$$mwm" -c random_page_cost="$$rpc" -c jit=off
      - pg-autotune
    command: [postgres]
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-2g}
        reservations:
          memory: ${PG_MEM_RESERVATION:-512m}

  meilisearch:
    security_opt:
      - no-new-privileges:true
    # По умолчанию Meili берёт под индексацию до ⅔ памяти ХОСТА, а не лимита
    # контейнера — на большой коллекции индексация упиралась бы в лимит. Держим
    # заметно ниже MEILI_MEM_LIMIT (поднимаете лимит — поднимите и это).
    environment:
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-1Gb}
    deploy:
      resources:
        limits:
          memory: ${MEILI_MEM_LIMIT:-2g}
        reservations:
          memory: ${MEILI_MEM_RESERVATION:-1g}

  backend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # /cache — named volume (writable) из базы; books/inpx — :ro; корень FS read-only.
    # Конвертер fb2cng пишет во временные каталоги под /cache и в /tmp.
    tmpfs:
      - /tmp
    # Метрики Prometheus на внутреннем порту — наружу не публикуется, их отдаёт
    # внутренний сайт Caddy :9180 (см. Caddyfile.public). Пусто — выключено.
    environment:
      SKRIPTES_METRICS_ADDR: ${SKRIPTES_METRICS_ADDR-:9091}
      # Откуда OPDS принимает основной пароль (снаружи — только пароли устройств,
      # #389). Та же переменная, что у caddy; не задана — только 127.0.0.1.
      SKRIPTES_LAN_CIDRS: ${SKRIPTES_LAN_CIDRS:-127.0.0.1/32}
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx-unprivileged: non-root (uid 101), слушает 8080 (>1024 → NET_BIND_SERVICE
    # НЕ нужен, нулевые капы), пишет pid/temp под /tmp → одного tmpfs /tmp хватает
    # под read-only FS.
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m

  caddy:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # caddy слушает :80/:443
    read_only: true
    tmpfs:
      - /tmp
    # Доверенные сети для админ-API (см. Caddyfile.public). Пусто/не задано →
    # закрыто для всех; дом — напр. «192.168.0.0/24 10.50.0.1/32».
    environment:
      SKRIPTES_LAN_CIDRS: ${SKRIPTES_LAN_CIDRS:-127.0.0.1/32}
      # Кому отдавать метрики на :9180 (сборщик Prometheus/Alloy из доверенной сети),
      # CIDR через пробел. Не задано → никому.
      SKRIPTES_METRICS_CIDRS: ${SKRIPTES_METRICS_CIDRS:-127.0.0.1/32}
    # Порт метрик: по умолчанию только на 127.0.0.1 хоста. Чтобы забирать из LAN —
    # SKRIPTES_METRICS_BIND=<адрес хоста> + правило роутера только для сборщика.
    ports:
      - "${SKRIPTES_METRICS_BIND:-127.0.0.1}:9180:9180"
    # Публичный Caddyfile (TLS Let's Encrypt, вырезание поддельных IP-заголовков,
    # админ-API только из SKRIPTES_LAN_CIDRS) вместо базового: тот же путь
    # в контейнере — compose заменяет монтирование базы. /data (сертификаты), /config — named volumes (writable).
    volumes:
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro
    deploy:
      resources:
        limits:
          memory: 256m
