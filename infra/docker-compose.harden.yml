# Overlay безопасного хардненинга для ПУБЛИЧНОГО (DMZ) деплоя.
#
# Накладывается ПОВЕРХ release-compose:
#   docker compose -f docker-compose.release.yml -f docker-compose.harden.yml \
#                  --env-file .env up -d
#
# Вход — прямо из интернета: на роутере проброшены 443 и 80 на этот хост, TLS
# (Let's Encrypt) делает Caddy сам по infra/Caddyfile.public (его этот overlay и
# монтирует). Хост — изолированный (отдельная VM/VLAN без доступа в LAN).
#
# Принципы: non-root + cap_drop ALL + read-only FS + no-new-privileges + лимиты,
# НИГДЕ нет docker.sock. Внутренние стораджи (postgres/meilisearch) — без read-only
# (пишут в свои volume'ы) и без агрессивного cap_drop (нужны капы для user-drop),
# но с no-new-privileges + лимитами. Интернет-фейсинг (backend/frontend/caddy) —
# полный хардненинг. Книги — локальный путь на хосте (BOOKS_HOST_PATH), не
# сетевой mount из LAN.
#
# Лимиты памяти postgres/meilisearch — из env (PG_MEM_LIMIT / MEILI_MEM_LIMIT). Дефолт
# 2g — с запасом для коллекции ~550 тыс. книг: после полного импорта librusec оба
# держатся около 0,9 ГБ, а пики (индексация Meili, тяжёлые запросы PG) выше.
services:
  postgres:
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${PG_MEM_LIMIT:-2g}

  meilisearch:
    security_opt:
      - no-new-privileges:true
    # По умолчанию Meili берёт под индексацию до ⅔ памяти ХОСТА, а не лимита
    # контейнера — на большой коллекции индексация упиралась бы в лимит. Держим
    # заметно ниже MEILI_MEM_LIMIT (поднимаете лимит — поднимите и это).
    environment:
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-1Gb}
    deploy:
      resources:
        limits:
          memory: ${MEILI_MEM_LIMIT:-2g}

  backend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    # /cache — named volume (writable) из базы; books/inpx — :ro; корень FS read-only.
    # Конвертер fb2cng пишет во временные каталоги под /cache и в /tmp.
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx-unprivileged: non-root (uid 101), слушает 8080 (>1024 → NET_BIND_SERVICE
    # НЕ нужен, нулевые капы), пишет pid/temp под /tmp → одного tmpfs /tmp хватает
    # под read-only FS.
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 256m

  caddy:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # caddy слушает :80/:443
    read_only: true
    tmpfs:
      - /tmp
    # Доверенные сети для админ-API и OPDS (см. Caddyfile.public). Пусто/не задано →
    # закрыто для всех; дом — напр. «192.168.0.0/24 10.50.0.1/32».
    environment:
      SKRIPTES_LAN_CIDRS: ${SKRIPTES_LAN_CIDRS:-127.0.0.1/32}
    # Публичный Caddyfile (TLS Let's Encrypt, вырезание поддельных IP-заголовков,
    # админ-API и OPDS только из SKRIPTES_LAN_CIDRS) вместо базового: тот же путь
    # в контейнере — compose заменяет монтирование базы. /data (сертификаты), /config — named volumes (writable).
    volumes:
      - ./Caddyfile.public:/etc/caddy/Caddyfile:ro
    deploy:
      resources:
        limits:
          memory: 256m
