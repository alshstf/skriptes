server {
  listen 8080; # nginx-unprivileged (non-root) слушает 8080, не 80
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # CSP и т.п. — include в КАЖДОМ location (add_header в location отменяет
  # заголовки уровня server), см. комментарий в самом файле.

  # SPA fallback
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }

  # Кэшируем хешированные ассеты надолго
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Не кэшируем index.html (для деплоев)
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
  }
}
