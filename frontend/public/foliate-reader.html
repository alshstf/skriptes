<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>skriptes reader</title>
<style>
  /* Цвета страницы задаёт ридер (тема из настроек ReaderPage) через
     --bg/--fg; до этого — нейтральные системные. Своих панелей у iframe
     нет: вся «обвязка» (назад, закладка, заметки, настройки) — оверлей
     ReaderPage, страница книги — во весь iframe. */
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg, Canvas);
    color: var(--fg, CanvasText);
    font-family: system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    overflow: hidden;
    overscroll-behavior: none;
  }
  #view-host {
    position: relative;
    height: 100%;
    overflow: hidden;
  }
  foliate-view {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Колонтитулы foliate (глава сверху, процент снизу) — мелко и тихо. */
  foliate-view::part(head),
  foliate-view::part(foot) {
    font-variant-numeric: tabular-nums;
  }
  #status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    text-align: center;
    color: color-mix(in srgb, currentColor 60%, transparent);
    font-size: 14px;
  }
</style>

<div id="view-host">
  <div id="status">Загружаем книгу…</div>
</div>

<script type="module" src="/foliate-reader.js"></script>
