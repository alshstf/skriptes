# Заголовки безопасности фронта. Подключается include'ом В КАЖДЫЙ location
# nginx.conf: add_header внутри location отменяет всё, что задано на уровне server.
# Этот же файл читает vite.config.ts (preview.headers) — e2e гоняются под той же CSP.
#
# Главное — script-src 'self' без 'unsafe-inline': ридер (foliate-js) рендерит
# страницы книги в blob:-iframe'ах с sandbox="allow-same-origin allow-scripts" на
# нашем origin, и такие iframe'ы наследуют CSP создавшей их страницы. Без неё
# <script>, onerror= или javascript:-ссылка внутри fb2/EPUB выполнились бы с
# правами сайта (fetch в /api с сессией читателя, у админа — админские действия).
#
# style-src 'unsafe-inline' — inline-стили Radix/sonner и стили книг; blob: в
# style/img/font/media — ресурсы EPUB, которые foliate отдаёт через blob:-URL.
# frame-ancestors 'self' — ридер открывается во фрейме только у себя.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob:; frame-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
